version: '3.9'
services:
  clouud:
    build:
      context: .
      dockerfile: Dockerfile.slim
    image: clouud:slim
    ports:
      - "5001:5001"
    environment:
      DATABASE_URL: postgresql://clouud:${DB_PASSWORD:-clouud}@db:5432/clouud?sslmode=disable
      NODE_ENV: production
      PORT: 5001
      AI_BACKEND: "none"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - clouud-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clouud
      POSTGRES_PASSWORD: ${DB_PASSWORD:-clouud}
      POSTGRES_DB: clouud
      POSTGRES_INITDB_ARGS: "-c shared_buffers=256MB -c max_connections=50"
    ports:
      - "5433:5432"
    volumes:
      - clouud_db:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - clouud-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clouud"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  clouud_db:
    driver: local

networks:
  clouud-network:
    driver: bridge
