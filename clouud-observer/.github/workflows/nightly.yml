name: nightly-review
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 nightly_review.py
      - run: |
          git config user.name "clouud-bot"
          git config user.email "bot@uuon"
          git add logs/review_reports.jsonl
          git commit -m "nightly review" || echo "no change"
          git push
