<title>UUON.UUORLD — by UUON Foundation</title>
<style>
  :root {
    --black: #000000;
    --panel: #0c0c0c;
    --line: rgba(255,255,255,0.14);
    --line-soft: rgba(255,255,255,0.07);
    --white: #ffffff;
    --dim: rgba(255,255,255,0.55);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--black); color: var(--white); }
  body {
    font-family: 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  button, a { cursor: pointer; }
  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--white);
    outline-offset: 3px;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  /* ---------- TOP BAND : logo + socials + wave + welcome ---------- */
  .top-band { position: relative; height: 210px; border-bottom: 1px solid var(--line); overflow: hidden; }
  .top-row {
    position: relative; z-index: 2;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 22px 36px 0;
  }
  .logo-block { line-height: 1; }
  .logo-title {
    font-weight: 800; font-size: 26px; letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .logo-sub {
    font-size: 9px; letter-spacing: 0.18em; color: var(--dim);
    text-transform: uppercase; margin-top: 5px; font-weight: 600;
  }
  .social-row { display: flex; gap: 16px; align-items: center; padding-top: 4px; }
  .social-row a { color: var(--dim); transition: color 0.2s, transform 0.2s; }
  .social-row a:hover { color: var(--white); transform: translateY(-1px); }
  .social-row svg { width: 17px; height: 17px; fill: currentColor; display: block; }

  .welcome-msg {
    position: absolute; left: 0; right: 0; bottom: 16px; z-index: 2;
    text-align: center;
    font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--dim); font-weight: 600;
  }
  .welcome-msg strong { color: var(--white); font-weight: 800; }

  canvas#wave { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.9; }

  /* ---------- ICON GRID BAND ---------- */
  .grid-band {
    position: relative;
    background: #050505;
    border-bottom: 1px solid var(--line);
    padding: 56px 24px 50px;
  }
  .grid-band::before {
    content: ''; position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(115deg, var(--line-soft) 0 1px, transparent 1px 90px),
      repeating-linear-gradient(65deg, var(--line-soft) 0 1px, transparent 1px 90px);
    opacity: 0.6;
  }
  .icon-grid {
    position: relative; z-index: 1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    max-width: 980px; margin: 0 auto;
    gap: 44px 8px;
  }
  .icon-tile {
    display: flex; flex-direction: column; align-items: center; gap: 18px;
    text-decoration: none; color: var(--white);
    padding: 14px 10px 6px;
    border-radius: 4px;
    transition: background 0.2s, transform 0.2s;
  }
  .icon-tile:hover { background: rgba(255,255,255,0.05); transform: translateY(-2px); }
  .icon-tile svg { width: 64px; height: 64px; stroke: var(--white); fill: none; stroke-width: 1.4; }
  .icon-label {
    font-size: 13px; font-weight: 800; letter-spacing: 0.05em;
    text-transform: uppercase; text-align: center; line-height: 1.3;
  }

  @media (max-width: 980px) {
    .icon-grid { grid-template-columns: repeat(4, 1fr); gap: 32px 6px; }
  }
  @media (max-width: 640px) {
    .icon-grid { grid-template-columns: repeat(2, 1fr); }
    .top-row { padding: 18px 20px 0; }
    .logo-title { font-size: 21px; }
    .social-row { gap: 12px; }
  }

  /* ---------- FOOTER BAND : sign up / login ---------- */
  .footer-band {
    position: relative; padding: 70px 24px 80px; text-align: center;
    background: #000;
    background-image:
      repeating-linear-gradient(115deg, var(--line-soft) 0 1px, transparent 1px 90px),
      repeating-linear-gradient(65deg, var(--line-soft) 0 1px, transparent 1px 90px);
  }
  .auth-cta {
    background: transparent; border: 1px solid var(--line);
    color: var(--white); font-weight: 800; letter-spacing: 0.18em;
    text-transform: uppercase; font-size: 14px;
    padding: 14px 30px; border-radius: 3px;
    transition: background 0.2s, border-color 0.2s;
    display: inline-flex; align-items: center; gap: 10px;
  }
  .auth-cta:hover { background: var(--white); color: #000; border-color: var(--white); }
  .auth-cta svg { width: 17px; height: 17px; fill: currentColor; }
</style>

<script>
// Subtle dot-wave texture in the top band — decorative only, respects reduced motion.
(function () {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var canvas = document.getElementById('wave');
  var ctx = canvas.getContext('2d');
  function resize() {
    var dpr = window.devicePixelRatio || 1;
    canvas.width = canvas.clientWidth * dpr;
    canvas.height = canvas.clientHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  var t = 0;
  function frame() {
    var w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);
    var spacing = 14;
    for (var y = 0; y < h * 0.65; y += spacing) {
      for (var x = 0; x < w; x += spacing) {
        var dist = (x / w);
        var amp = (1 - y / (h * 0.65)) * 10;
        var wave = Math.sin(dist * 10 + t + y * 0.02) * amp;
        var py = y + wave * 0.4;
        var alpha = 0.08 + 0.10 * Math.max(0, 1 - y / (h * 0.65));
        ctx.fillStyle = 'rgba(255,255,255,' + alpha + ')';
        ctx.fillRect(x, py, 1.4, 1.4);
      }
    }
    if (!reduce) { t += 0.01; requestAnimationFrame(frame); }
  }
  frame();
})();
</script>
