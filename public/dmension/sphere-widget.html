
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Sphere Widget - Δmension Platform</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #1e1e1e, #0a0a0a);
            font-family: 'Arial', sans-serif;
            color: white;
            overflow-x: hidden;
        }
        
        .sphere-container {
            width: 100%;
            max-width: 800px;
            height: 500px;
            margin: 0 auto;
            border: 2px solid #00ff88;
            border-radius: 15px;
            position: relative;
            background: rgba(0, 0, 0, 0.3);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
        }
        
        .controls-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #4ecdc4;
            z-index: 100;
            min-width: 200px;
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        .control-group label {
            display: block;
            color: #4ecdc4;
            font-size: 12px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        
        .control-group input[type="range"] {
            width: 100%;
            height: 5px;
            background: #333;
            border-radius: 5px;
            outline: none;
            -webkit-appearance: none;
        }
        
        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 15px;
            height: 15px;
            background: #00ff88;
            border-radius: 50%;
            cursor: pointer;
        }
        
        .color-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .color-btn {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }
        
        .color-btn:hover, .color-btn.active {
            border-color: white;
            transform: scale(1.1);
        }
        
        .info-display {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 11px;
            color: #00ff88;
            border: 1px solid #00ff88;
        }
        
        .instructions {
            text-align: center;
            margin: 20px 0;
            color: #4ecdc4;
            font-size: 14px;
        }
        
        .quantum-glow {
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #00ff88, #4ecdc4, #ff6b6b, #ffe66d);
            background-size: 200% 200%;
            animation: quantumPulse 3s ease-in-out infinite;
            border-radius: 15px;
            z-index: -1;
            opacity: 0.3;
        }
        
        @keyframes quantumPulse {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div class="instructions">
        <h2>🌟 Interactive Sphere - Δmension Platform</h2>
        <p>Use mouse to rotate • Scroll to zoom • Controls to customize</p>
    </div>
    
    <div class="sphere-container" id="sphereContainer">
        <div class="quantum-glow"></div>
        
        <div class="controls-panel">
            <div class="control-group">
                <label>Size</label>
                <input type="range" id="sizeSlider" min="0.5" max="3" step="0.1" value="1.5">
            </div>
            
            <div class="control-group">
                <label>Wireframe</label>
                <input type="checkbox" id="wireframeToggle">
            </div>
            
            <div class="control-group">
                <label>Colors</label>
                <div class="color-buttons">
                    <button class="color-btn active" style="background: #00ff88" data-color="#00ff88"></button>
                    <button class="color-btn" style="background: #4ecdc4" data-color="#4ecdc4"></button>
                    <button class="color-btn" style="background: #ff6b6b" data-color="#ff6b6b"></button>
                    <button class="color-btn" style="background: #ffe66d" data-color="#ffe66d"></button>
                    <button class="color-btn" style="background: #a8e6cf" data-color="#a8e6cf"></button>
                    <button class="color-btn" style="background: #ff8b94" data-color="#ff8b94"></button>
                </div>
            </div>
            
            <div class="control-group">
                <label>Animation Speed</label>
                <input type="range" id="speedSlider" min="0" max="2" step="0.1" value="0.5">
            </div>
        </div>
        
        <div class="info-display" id="infoDisplay">
            Position: (0, 0, 0)<br>
            Rotation: (0, 0, 0)<br>
            Scale: 1.5
        </div>
    </div>

    <script>
        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, 800/500, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        
        const container = document.getElementById('sphereContainer');
        renderer.setSize(800, 500);
        renderer.setClearColor(0x000000, 0);
        container.appendChild(renderer.domElement);
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);
        
        const pointLight = new THREE.PointLight(0x00ff88, 1, 100);
        pointLight.position.set(0, 0, 10);
        scene.add(pointLight);
        
        // Create sphere
        const sphereGeometry = new THREE.SphereGeometry(1.5, 32, 32);
        const sphereMaterial = new THREE.MeshPhongMaterial({
            color: 0x00ff88,
            shininess: 100,
            transparent: true,
            opacity: 0.9
        });
        const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        scene.add(sphere);
        
        // Camera position
        camera.position.z = 5;
        
        // Mouse interaction variables
        let mouseX = 0, mouseY = 0;
        let targetRotationX = 0, targetRotationY = 0;
        let animationSpeed = 0.5;
        
        // Controls
        const sizeSlider = document.getElementById('sizeSlider');
        const wireframeToggle = document.getElementById('wireframeToggle');
        const speedSlider = document.getElementById('speedSlider');
        const colorButtons = document.querySelectorAll('.color-btn');
        const infoDisplay = document.getElementById('infoDisplay');
        
        // Event listeners
        sizeSlider.addEventListener('input', (e) => {
            const scale = parseFloat(e.target.value);
            sphere.scale.set(scale, scale, scale);
        });
        
        wireframeToggle.addEventListener('change', (e) => {
            sphereMaterial.wireframe = e.target.checked;
        });
        
        speedSlider.addEventListener('input', (e) => {
            animationSpeed = parseFloat(e.target.value);
        });
        
        colorButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                colorButtons.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                const color = e.target.dataset.color;
                sphereMaterial.color.setHex(color.replace('#', '0x'));
                pointLight.color.setHex(color.replace('#', '0x'));
            });
        });
        
        // Mouse events
        container.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            mouseX = (e.clientX - rect.left - rect.width / 2) / (rect.width / 2);
            mouseY = (e.clientY - rect.top - rect.height / 2) / (rect.height / 2);
            
            targetRotationY = mouseX * Math.PI;
            targetRotationX = mouseY * Math.PI;
        });
        
        // Zoom with mouse wheel
        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            camera.position.z += e.deltaY * 0.01;
            camera.position.z = Math.max(2, Math.min(10, camera.position.z));
        });
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            // Smooth rotation
            sphere.rotation.y += (targetRotationY - sphere.rotation.y) * 0.05;
            sphere.rotation.x += (targetRotationX - sphere.rotation.x) * 0.05;
            
            // Auto rotation when not interacting
            if (animationSpeed > 0) {
                sphere.rotation.y += animationSpeed * 0.01;
            }
            
            // Update info display
            infoDisplay.innerHTML = `
                Position: (${sphere.position.x.toFixed(2)}, ${sphere.position.y.toFixed(2)}, ${sphere.position.z.toFixed(2)})<br>
                Rotation: (${(sphere.rotation.x * 180/Math.PI).toFixed(1)}°, ${(sphere.rotation.y * 180/Math.PI).toFixed(1)}°, ${(sphere.rotation.z * 180/Math.PI).toFixed(1)}°)<br>
                Scale: ${sphere.scale.x.toFixed(2)}
            `;
            
            renderer.render(scene, camera);
        }
        
        animate();
        
        // Responsive resize
        window.addEventListener('resize', () => {
            const width = Math.min(800, window.innerWidth - 40);
            const height = (width / 800) * 500;
            
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });
        
        // Initial resize
        window.dispatchEvent(new Event('resize'));
        
        console.log('%c🌟 Interactive Sphere Widget Loaded', 'color: #00ff88; font-size: 16px; font-weight: bold;');
    </script>
</body>
</html>
