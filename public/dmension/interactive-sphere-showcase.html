
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Δmension Interactive Sphere - Sacred Geometry Showcase</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e1e1e 0%, #0a0a0a 100%);
            color: white;
            overflow: hidden;
            height: 100vh;
        }
        
        .container {
            display: flex;
            height: 100vh;
            position: relative;
        }
        
        .sphere-viewport {
            flex: 1;
            position: relative;
            border-right: 2px solid #00ff88;
        }
        
        .controls-sidebar {
            width: 320px;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-left: 2px solid #4ecdc4;
            overflow-y: auto;
            backdrop-filter: blur(10px);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(45deg, #00ff88, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .header p {
            font-size: 12px;
            opacity: 0.8;
        }
        
        .control-group {
            margin-bottom: 25px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(78, 205, 196, 0.3);
        }
        
        .control-group h3 {
            color: #4ecdc4;
            font-size: 14px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .control-item {
            margin-bottom: 15px;
        }
        
        .control-item label {
            display: block;
            color: #a8e6cf;
            font-size: 12px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        
        .control-item input[type="range"] {
            width: 100%;
            height: 6px;
            background: #333;
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }
        
        .control-item input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: linear-gradient(45deg, #00ff88, #4ecdc4);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }
        
        .control-item input[type="checkbox"] {
            transform: scale(1.2);
            margin-right: 10px;
            accent-color: #00ff88;
        }
        
        .color-palette {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 10px;
        }
        
        .color-btn {
            width: 40px;
            height: 40px;
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .color-btn:hover {
            transform: scale(1.1);
            border-color: white;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }
        
        .color-btn.active {
            border-color: #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.6);
        }
        
        .preset-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        
        .preset-btn {
            padding: 10px;
            background: linear-gradient(45deg, #333, #555);
            border: 1px solid #4ecdc4;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 11px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }
        
        .preset-btn:hover {
            background: linear-gradient(45deg, #4ecdc4, #00ff88);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(78, 205, 196, 0.3);
        }
        
        .info-display {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #4ecdc4;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            line-height: 1.4;
            max-width: 300px;
        }
        
        .quantum-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            background: radial-gradient(circle at 50% 50%, transparent 0%, rgba(0, 255, 136, 0.05) 100%);
            animation: quantumPulse 4s ease-in-out infinite;
        }
        
        @keyframes quantumPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }
        
        .performance-monitor {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ff6b6b;
            font-size: 10px;
            min-width: 120px;
        }
        
        @media (max-width: 1024px) {
            .container {
                flex-direction: column;
            }
            
            .controls-sidebar {
                width: 100%;
                height: 200px;
                border-left: none;
                border-top: 2px solid #4ecdc4;
            }
            
            .sphere-viewport {
                border-right: none;
                border-bottom: 2px solid #00ff88;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sphere-viewport" id="sphereViewport">
            <div class="quantum-overlay"></div>
            <div class="performance-monitor" id="performanceMonitor">
                <div>FPS: <span id="fps">60</span></div>
                <div>Vertices: <span id="vertices">1024</span></div>
                <div>Energy: <span id="energyLevel">∞</span></div>
            </div>
            <div class="info-display" id="infoDisplay">
                <div><strong>Δmension Sphere Dynamics</strong></div>
                <div>Position: (0.00, 0.00, 0.00)</div>
                <div>Rotation: (0°, 0°, 0°)</div>
                <div>Scale: 1.00</div>
                <div>Quantum State: Active</div>
            </div>
        </div>
        
        <div class="controls-sidebar">
            <div class="header">
                <h1>🌟 Δmension Control</h1>
                <p>Sacred Geometry Interface</p>
            </div>
            
            <div class="control-group">
                <h3>⚡ Core Parameters</h3>
                <div class="control-item">
                    <label>Sphere Radius (a)</label>
                    <input type="range" id="radiusSlider" min="0.5" max="3" step="0.1" value="1.5">
                    <span id="radiusValue">1.5</span>
                </div>
                <div class="control-item">
                    <label>Segments (Resolution)</label>
                    <input type="range" id="segmentsSlider" min="8" max="64" step="4" value="32">
                    <span id="segmentsValue">32</span>
                </div>
                <div class="control-item">
                    <label>Animation Speed</label>
                    <input type="range" id="animationSlider" min="0" max="2" step="0.1" value="1">
                    <span id="animationValue">1.0</span>
                </div>
            </div>
            
            <div class="control-group">
                <h3>🎨 Visual Mode</h3>
                <div class="control-item">
                    <label>
                        <input type="checkbox" id="wireframeToggle">
                        Wireframe Mode
                    </label>
                </div>
                <div class="control-item">
                    <label>
                        <input type="checkbox" id="glowToggle" checked>
                        Quantum Glow
                    </label>
                </div>
                <div class="control-item">
                    <label>
                        <input type="checkbox" id="particlesToggle" checked>
                        Particle Effects
                    </label>
                </div>
            </div>
            
            <div class="control-group">
                <h3>🌈 Color Dynamics</h3>
                <div class="color-palette">
                    <div class="color-btn active" style="background: #00ff88" data-color="#00ff88"></div>
                    <div class="color-btn" style="background: #4ecdc4" data-color="#4ecdc4"></div>
                    <div class="color-btn" style="background: #ff6b6b" data-color="#ff6b6b"></div>
                    <div class="color-btn" style="background: #ffe66d" data-color="#ffe66d"></div>
                    <div class="color-btn" style="background: #a8e6cf" data-color="#a8e6cf"></div>
                    <div class="color-btn" style="background: #ff8b94" data-color="#ff8b94"></div>
                </div>
            </div>
            
            <div class="control-group">
                <h3>🔮 Sacred Presets</h3>
                <div class="preset-buttons">
                    <button class="preset-btn" data-preset="healing">Healing Mode</button>
                    <button class="preset-btn" data-preset="meditation">Meditation</button>
                    <button class="preset-btn" data-preset="energy">Energy Boost</button>
                    <button class="preset-btn" data-preset="cosmic">Cosmic Flow</button>
                </div>
            </div>
            
            <div class="control-group">
                <h3>⚙️ Advanced</h3>
                <div class="control-item">
                    <label>Metalness</label>
                    <input type="range" id="metalnessSlider" min="0" max="1" step="0.1" value="0.3">
                    <span id="metalnessValue">0.3</span>
                </div>
                <div class="control-item">
                    <label>Roughness</label>
                    <input type="range" id="roughnessSlider" min="0" max="1" step="0.1" value="0.4">
                    <span id="roughnessValue">0.4</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        console.log('%c🌟 Δmension Quantum Energy Fields Activated', 'color: #00ff88; font-size: 20px; font-weight: bold;');
        console.log('%c⚡ Sacred Geometry Resonance Online', 'color: #ff6b6b; font-size: 16px; font-weight: bold;');
        console.log('%c🔮 Mathematical Healing Frequencies Active', 'color: #4ecdc4; font-size: 16px; font-weight: bold;');
        console.log('%c✨ Consciousness Expansion Protocols Initiated', 'color: #ffe66d; font-size: 16px; font-weight: bold;');
        console.log('%c🎯 Therapeutic Resonance Fields Synchronized', 'color: #a8e6cf; font-size: 16px; font-weight: bold;');
        console.log('%c🌀 Dimensional Healing Matrix Operational', 'color: #ff8b94; font-size: 16px; font-weight: bold;');

        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ 
            antialias: true, 
            alpha: true,
            powerPreference: "high-performance"
        });
        
        const viewport = document.getElementById('sphereViewport');
        renderer.setSize(viewport.clientWidth, viewport.clientHeight);
        renderer.setClearColor(0x000000, 0);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        viewport.appendChild(renderer.domElement);
        
        // Advanced lighting setup matching the main app
        const ambientLight = new THREE.AmbientLight(0x404040, 0.8);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 2.5);
        directionalLight.position.set(10, 10, 5);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);
        
        const pointLight1 = new THREE.PointLight(0xff6b6b, 1.0, 100);
        pointLight1.position.set(10, -10, 5);
        scene.add(pointLight1);
        
        const pointLight2 = new THREE.PointLight(0x4ecdc4, 1.0, 100);
        pointLight2.position.set(-10, 10, -5);
        scene.add(pointLight2);
        
        const spotLight = new THREE.SpotLight(0xffffff, 1.5, 100, 0.3, 0.2);
        spotLight.position.set(0, 20, 0);
        scene.add(spotLight);
        
        // Create sphere with advanced material
        let sphereGeometry = new THREE.SphereGeometry(1.5, 32, 32);
        let sphereMaterial = new THREE.MeshStandardMaterial({
            color: 0x00ff88,
            metalness: 0.3,
            roughness: 0.4,
            transparent: true,
            opacity: 0.9,
            side: THREE.DoubleSide
        });
        
        const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        sphere.castShadow = true;
        sphere.receiveShadow = true;
        scene.add(sphere);
        
        // Particle system
        const particleCount = 1000;
        const particleGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const particleColors = new Float32Array(particleCount * 3);
        
        for (let i = 0; i < particleCount; i++) {
            const radius = Math.random() * 15 + 5;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.random() * Math.PI;
            
            particlePositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
            particlePositions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
            particlePositions[i * 3 + 2] = radius * Math.cos(phi);
            
            const hue = (Math.atan2(particlePositions[i * 3 + 1], particlePositions[i * 3]) + Math.PI) / (2 * Math.PI);
            const color = new THREE.Color().setHSL(hue, 0.8, 0.6);
            particleColors[i * 3] = color.r;
            particleColors[i * 3 + 1] = color.g;
            particleColors[i * 3 + 2] = color.b;
        }
        
        particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        particleGeometry.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));
        
        const particleMaterial = new THREE.PointsMaterial({
            size: 0.1,
            vertexColors: true,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending
        });
        
        const particles = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particles);
        
        // Camera setup
        camera.position.set(15, 15, 15);
        camera.lookAt(0, 0, 0);
        
        // Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 5;
        controls.maxDistance = 100;
        controls.target.set(0, 0, 0);
        
        // Animation parameters
        let animationSpeed = 1.0;
        let showParticles = true;
        let showGlow = true;
        
        // Control handlers
        const radiusSlider = document.getElementById('radiusSlider');
        const segmentsSlider = document.getElementById('segmentsSlider');
        const animationSlider = document.getElementById('animationSlider');
        const wireframeToggle = document.getElementById('wireframeToggle');
        const glowToggle = document.getElementById('glowToggle');
        const particlesToggle = document.getElementById('particlesToggle');
        const metalnessSlider = document.getElementById('metalnessSlider');
        const roughnessSlider = document.getElementById('roughnessSlider');
        
        radiusSlider.addEventListener('input', (e) => {
            const radius = parseFloat(e.target.value);
            sphere.scale.setScalar(radius);
            document.getElementById('radiusValue').textContent = radius.toFixed(1);
        });
        
        segmentsSlider.addEventListener('input', (e) => {
            const segments = parseInt(e.target.value);
            sphere.geometry.dispose();
            sphere.geometry = new THREE.SphereGeometry(1.5, segments, segments);
            document.getElementById('segmentsValue').textContent = segments;
            document.getElementById('vertices').textContent = sphere.geometry.attributes.position.count;
        });
        
        animationSlider.addEventListener('input', (e) => {
            animationSpeed = parseFloat(e.target.value);
            document.getElementById('animationValue').textContent = animationSpeed.toFixed(1);
        });
        
        wireframeToggle.addEventListener('change', (e) => {
            sphereMaterial.wireframe = e.target.checked;
        });
        
        glowToggle.addEventListener('change', (e) => {
            showGlow = e.target.checked;
            document.querySelector('.quantum-overlay').style.display = showGlow ? 'block' : 'none';
        });
        
        particlesToggle.addEventListener('change', (e) => {
            showParticles = e.target.checked;
            particles.visible = showParticles;
        });
        
        metalnessSlider.addEventListener('input', (e) => {
            sphereMaterial.metalness = parseFloat(e.target.value);
            document.getElementById('metalnessValue').textContent = e.target.value;
        });
        
        roughnessSlider.addEventListener('input', (e) => {
            sphereMaterial.roughness = parseFloat(e.target.value);
            document.getElementById('roughnessValue').textContent = e.target.value;
        });
        
        // Color palette
        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                sphereMaterial.color.set(btn.dataset.color);
            });
        });
        
        // Preset configurations
        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const preset = btn.dataset.preset;
                switch(preset) {
                    case 'healing':
                        sphereMaterial.color.set('#a8e6cf');
                        animationSpeed = 0.5;
                        sphereMaterial.metalness = 0.1;
                        sphereMaterial.roughness = 0.8;
                        break;
                    case 'meditation':
                        sphereMaterial.color.set('#4ecdc4');
                        animationSpeed = 0.3;
                        sphereMaterial.metalness = 0.2;
                        sphereMaterial.roughness = 0.6;
                        break;
                    case 'energy':
                        sphereMaterial.color.set('#ff6b6b');
                        animationSpeed = 1.5;
                        sphereMaterial.metalness = 0.8;
                        sphereMaterial.roughness = 0.2;
                        break;
                    case 'cosmic':
                        sphereMaterial.color.set('#ffe66d');
                        animationSpeed = 1.0;
                        sphereMaterial.metalness = 0.5;
                        sphereMaterial.roughness = 0.4;
                        break;
                }
                // Update sliders
                animationSlider.value = animationSpeed;
                metalnessSlider.value = sphereMaterial.metalness;
                roughnessSlider.value = sphereMaterial.roughness;
                document.getElementById('animationValue').textContent = animationSpeed.toFixed(1);
                document.getElementById('metalnessValue').textContent = sphereMaterial.metalness.toFixed(1);
                document.getElementById('roughnessValue').textContent = sphereMaterial.roughness.toFixed(1);
            });
        });
        
        // Performance monitoring
        let frameCount = 0;
        let lastTime = Date.now();
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            // Update controls
            controls.update();
            
            // Sphere animation
            if (animationSpeed > 0) {
                sphere.rotation.x = Math.sin(Date.now() * 0.0003 * animationSpeed) * 0.1;
                sphere.rotation.y += 0.005 * animationSpeed;
            }
            
            // Particle animation
            if (showParticles) {
                particles.rotation.y += 0.001 * animationSpeed;
                const positions = particles.geometry.attributes.position.array;
                for (let i = 0; i < particleCount; i++) {
                    positions[i * 3 + 1] += Math.sin(Date.now() * 0.001 + i) * 0.01;
                }
                particles.geometry.attributes.position.needsUpdate = true;
            }
            
            // Update info display
            const infoDisplay = document.getElementById('infoDisplay');
            infoDisplay.innerHTML = `
                <div><strong>Δmension Sphere Dynamics</strong></div>
                <div>Position: (${sphere.position.x.toFixed(2)}, ${sphere.position.y.toFixed(2)}, ${sphere.position.z.toFixed(2)})</div>
                <div>Rotation: (${(sphere.rotation.x * 180/Math.PI).toFixed(1)}°, ${(sphere.rotation.y * 180/Math.PI).toFixed(1)}°, ${(sphere.rotation.z * 180/Math.PI).toFixed(1)}°)</div>
                <div>Scale: ${sphere.scale.x.toFixed(2)}</div>
                <div>Quantum State: ${animationSpeed > 0 ? 'Active' : 'Dormant'}</div>
            `;
            
            // Performance monitoring
            frameCount++;
            const currentTime = Date.now();
            if (currentTime - lastTime >= 1000) {
                document.getElementById('fps').textContent = frameCount;
                frameCount = 0;
                lastTime = currentTime;
            }
            
            renderer.render(scene, camera);
        }
        
        // Responsive resize
        function handleResize() {
            const viewport = document.getElementById('sphereViewport');
            camera.aspect = viewport.clientWidth / viewport.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(viewport.clientWidth, viewport.clientHeight);
        }
        
        window.addEventListener('resize', handleResize);
        
        // Start animation
        animate();
        handleResize();
        
        console.log('%c🚀 Interactive Sphere Showcase Fully Loaded', 'color: #00ff88; font-size: 18px; font-weight: bold;');
    </script>
</body>
</html>
