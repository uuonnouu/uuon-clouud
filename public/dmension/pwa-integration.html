
<!-- Service Worker Registration -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js')
      .then(function(registration) {
        console.log('ServiceWorker registration successful');
      }, function(err) {
        console.log('ServiceWorker registration failed: ', err);
      });
  });
}
</script>

<!-- App Install Banner -->
<script>
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  
  // Show install button
  const installButton = document.createElement('button');
  installButton.textContent = '📱 Install Δmension App';
  installButton.style.cssText = `
    position: fixed; bottom: 20px; right: 20px; z-index: 1000;
    background: linear-gradient(45deg, #00ff88, #0099ff);
    color: black; border: none; padding: 12px 20px;
    border-radius: 25px; font-weight: bold; cursor: pointer;
    box-shadow: 0 4px 15px rgba(0,255,136,0.3);
  `;
  
  installButton.addEventListener('click', () => {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then((choiceResult) => {
      if (choiceResult.outcome === 'accepted') {
        console.log('User accepted the install prompt');
      }
      deferredPrompt = null;
      installButton.remove();
    });
  });
  
  document.body.appendChild(installButton);
});
</script>

<!-- Offline Detection -->
<script>
window.addEventListener('online', () => {
  document.body.classList.remove('offline');
  showNotification('Back online! 🌐', 'success');
});

window.addEventListener('offline', () => {
  document.body.classList.add('offline');
  showNotification('You\'re offline. Some features may be limited. 📡', 'warning');
});

function showNotification(message, type) {
  const notification = document.createElement('div');
  notification.textContent = message;
  notification.style.cssText = `
    position: fixed; top: 20px; right: 20px; z-index: 10001;
    padding: 12px 20px; border-radius: 8px; color: white;
    background: ${type === 'success' ? '#00ff88' : '#ff6b6b'};
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  `;
  document.body.appendChild(notification);
  setTimeout(() => notification.remove(), 3000);
}
</script>
