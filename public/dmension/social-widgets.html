
<!-- Twitter/X Embed Widget -->
<div class="twitter-widget-container">
  <a class="twitter-timeline" 
     data-theme="dark" 
     data-tweet-limit="3" 
     href="https://twitter.com/DmensionApp?ref_src=twsrc%5Etfw">
    Tweets by DmensionApp
  </a>
  <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
</div>

<!-- YouTube Subscribe Button -->
<div class="youtube-widget">
  <script src="https://apis.google.com/js/platform.js"></script>
  <div class="g-ytsubscribe" 
       data-channelid="YOUR_CHANNEL_ID" 
       data-layout="default" 
       data-theme="dark" 
       data-count="default">
  </div>
</div>

<!-- Discord Widget -->
<div class="discord-widget">
  <iframe src="https://discord.com/widget?id=YOUR_SERVER_ID&theme=dark" 
          width="350" 
          height="500" 
          allowtransparency="true" 
          frameborder="0" 
          sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts">
  </iframe>
</div>
