
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Δmension 4D Mathematical Visualization</title>
    <meta name="description" content="Interactive 4D mathematical objects: tesseract, hypersphere, and higher-dimensional projections for PTSD therapy and mathematical healing">
    <meta name="keywords" content="4D visualization, tesseract, hypersphere, mathematical healing, PTSD therapy, sacred geometry, quantum mathematics">
    
    <!-- SEO Meta Tags -->
    <meta property="og:title" content="Δmension 4D Mathematical Visualization">
    <meta property="og:description" content="Experience interactive 4D mathematical objects for therapeutic healing and consciousness expansion">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://your-replit-url.replit.dev/4d-showcase.html">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0a0a0a, #1a1a2e, #16213e);
            color: #00ff41;
            overflow: hidden;
            height: 100vh;
        }
        
        #container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }
        
        #canvas-container {
            flex: 1;
            position: relative;
            background: radial-gradient(circle, #001122, #000000);
        }
        
        #controls-panel {
            width: 300px;
            background: rgba(0, 20, 40, 0.9);
            border-left: 2px solid #00ff41;
            padding: 20px;
            overflow-y: auto;
            backdrop-filter: blur(10px);
        }
        
        .control-group {
            margin-bottom: 25px;
            border: 1px solid #004400;
            border-radius: 8px;
            padding: 15px;
            background: rgba(0, 255, 65, 0.05);
        }
        
        .control-group h3 {
            color: #00ff41;
            margin-bottom: 10px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .shape-button {
            display: block;
            width: 100%;
            margin: 5px 0;
            padding: 8px 12px;
            background: linear-gradient(45deg, #003300, #006600);
            border: 1px solid #00ff41;
            color: #00ff41;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            font-size: 11px;
        }
        
        .shape-button:hover {
            background: linear-gradient(45deg, #006600, #00aa00);
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.5);
        }
        
        .shape-button.active {
            background: linear-gradient(45deg, #00aa00, #00ff41);
            color: #000;
            font-weight: bold;
        }
        
        .param-slider {
            width: 100%;
            margin: 8px 0;
            background: #003300;
            outline: none;
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        
        .param-slider:hover {
            opacity: 1;
        }
        
        .param-label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #88ff88;
            margin-bottom: 3px;
        }
        
        #info-display {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #00ff41;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            max-width: 300px;
        }
        
        .visualization-mode {
            display: flex;
            gap: 5px;
            margin: 10px 0;
        }
        
        .mode-btn {
            flex: 1;
            padding: 5px;
            background: #003300;
            border: 1px solid #006600;
            color: #00ff41;
            cursor: pointer;
            font-size: 10px;
            border-radius: 3px;
        }
        
        .mode-btn.active {
            background: #00aa00;
            color: #000;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="canvas-container">
            <canvas id="three-canvas"></canvas>
            <div id="info-display">
                <div id="shape-info">Select a 4D shape to begin</div>
                <div id="param-info"></div>
            </div>
        </div>
        
        <div id="controls-panel">
            <div class="control-group">
                <h3>🔮 4D Mathematical Objects</h3>
                <button class="shape-button" data-shape="tesseract_4d">⬛ Tesseract (4D Cube)</button>
                <button class="shape-button" data-shape="hypersphere_4d">🌐 Hypersphere (4D Sphere)</button>
                <button class="shape-button" data-shape="simplex_4d">🔺 Simplex (4D Tetrahedron)</button>
                <button class="shape-button" data-shape="cell_16">◈ 16-Cell (4D Octahedron)</button>
                <button class="shape-button" data-shape="cell_120">⬟ 120-Cell (4D Dodecahedron)</button>
                <button class="shape-button" data-shape="cell_600">⬢ 600-Cell (4D Icosahedron)</button>
            </div>
            
            <div class="control-group">
                <h3>🎨 Visualization Mode</h3>
                <div class="visualization-mode">
                    <button class="mode-btn active" data-mode="solid">Solid</button>
                    <button class="mode-btn" data-mode="wireframe">Wire</button>
                    <button class="mode-btn" data-mode="points">Points</button>
                </div>
            </div>
            
            <div class="control-group">
                <h3>⚡ 4D Parameters</h3>
                <div class="param-label">
                    <span>Size (a)</span>
                    <span id="param-a-value">2.0</span>
                </div>
                <input type="range" class="param-slider" id="param-a" min="0.5" max="4" step="0.1" value="2">
                
                <div class="param-label">
                    <span>4D Rotation (d)</span>
                    <span id="param-d-value">1.0</span>
                </div>
                <input type="range" class="param-slider" id="param-d" min="0" max="2" step="0.1" value="1">
                
                <div class="param-label">
                    <span>4D Phase (e)</span>
                    <span id="param-e-value">1.0</span>
                </div>
                <input type="range" class="param-slider" id="param-e" min="0" max="2" step="0.1" value="1">
                
                <div class="param-label">
                    <span>Projection (f)</span>
                    <span id="param-f-value">3.0</span>
                </div>
                <input type="range" class="param-slider" id="param-f" min="1" max="5" step="0.1" value="3">
                
                <div class="param-label">
                    <span>4D Depth (w)</span>
                    <span id="param-w-value">1.0</span>
                </div>
                <input type="range" class="param-slider" id="param-w" min="0.1" max="2" step="0.1" value="1">
            </div>
            
            <div class="control-group">
                <h3>🌈 Color Effects</h3>
                <div class="param-label">
                    <span>Hue Shift</span>
                    <span id="hue-value">120</span>
                </div>
                <input type="range" class="param-slider" id="hue-shift" min="0" max="360" step="10" value="120">
                
                <div class="param-label">
                    <span>Glow Intensity</span>
                    <span id="glow-value">0.8</span>
                </div>
                <input type="range" class="param-slider" id="glow-intensity" min="0" max="2" step="0.1" value="0.8">
            </div>
            
            <div class="control-group">
                <h3>🔄 Animation</h3>
                <button class="shape-button" id="toggle-animation">▶️ Start Auto-Rotation</button>
                <div class="param-label">
                    <span>Speed</span>
                    <span id="speed-value">1.0</span>
                </div>
                <input type="range" class="param-slider" id="anim-speed" min="0" max="3" step="0.1" value="1">
            </div>
        </div>
    </div>

    <script>
        // 4D Mathematical Visualization Engine
        let scene, camera, renderer, controls;
        let currentShape = null;
        let animationId = null;
        let isAnimating = false;
        let animationSpeed = 1.0;
        
        // Current parameters
        let params = {
            a: 2.0, b: 1.0, c: 1.0, d: 1.0, e: 1.0, f: 3.0, g: 1.0, h: 1.0,
            i: 1.0, j: 1.0, k: 1.0, l: 1.0, m: 1.0, n: 1.0, o: 1.0, p: 1.0,
            q: 1.0, r: 1.0, s: 1.0, t: 1.0, uParam: 1.0, vParam: 1.0, w: 1.0
        };
        
        // Initialize Three.js
        function init() {
            const canvas = document.getElementById('three-canvas');
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setClearColor(0x000000, 0);
            
            camera.position.set(5, 5, 5);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0x00ff41, 1);
            directionalLight.position.set(5, 5, 5);
            scene.add(directionalLight);
            
            setupEventListeners();
            animate();
        }
        
        // 4D Shape Equations
        const shapes4D = {
            tesseract_4d: {
                name: "Tesseract (4D Hypercube)",
                description: "16 vertices forming a 4D cube with perspective projection",
                equation: (u, v) => {
                    const vertexIndex = Math.floor(u * 16) % 16;
                    const x4d = ((vertexIndex & 1) ? 1 : -1) * params.a;
                    const y4d = ((vertexIndex & 2) ? 1 : -1) * params.a;
                    const z4d = ((vertexIndex & 4) ? 1 : -1) * params.a;
                    const w4d = ((vertexIndex & 8) ? 1 : -1) * params.a;
                    
                    const rotationAngle = v * Math.PI * 2 * params.d;
                    const cos_r = Math.cos(rotationAngle);
                    const sin_r = Math.sin(rotationAngle);
                    
                    const x4d_rot = x4d * cos_r - w4d * sin_r * params.e;
                    const w4d_rot = x4d * sin_r * params.e + w4d * cos_r;
                    
                    const distance = params.f * 4;
                    const perspective = distance / (distance - w4d_rot);
                    
                    return [
                        x4d_rot * perspective,
                        y4d * perspective,
                        z4d * perspective
                    ];
                }
            },
            
            hypersphere_4d: {
                name: "4D Hypersphere",
                description: "Four-dimensional sphere with stereographic projection",
                equation: (u, v) => {
                    const phi = u * Math.PI * 2 * params.d;
                    const theta = v * Math.PI * params.e;
                    const psi = Math.sin(u * v * Math.PI * 4) * params.f;
                    const chi = Math.cos(u + v) * params.g;
                    
                    const x4d = Math.sin(theta) * Math.cos(phi) * Math.cos(psi);
                    const y4d = Math.sin(theta) * Math.sin(phi) * Math.cos(psi);
                    const z4d = Math.cos(theta) * Math.cos(psi);
                    const w4d = Math.sin(psi) * Math.cos(chi);
                    
                    const projectionFactor = params.w / (1 - w4d * 0.5 + 0.1);
                    
                    return [
                        x4d * params.a * projectionFactor,
                        y4d * params.a * projectionFactor,
                        z4d * params.a * projectionFactor
                    ];
                }
            },
            
            simplex_4d: {
                name: "4D Simplex (5-Cell)",
                description: "Five vertices in 4D space forming tetrahedral arrangement",
                equation: (u, v) => {
                    const vertices = [
                        [1, 1, 1, -1/Math.sqrt(5)],
                        [1, -1, -1, -1/Math.sqrt(5)],
                        [-1, 1, -1, -1/Math.sqrt(5)],
                        [-1, -1, 1, -1/Math.sqrt(5)],
                        [0, 0, 0, Math.sqrt(5)/Math.sqrt(5)]
                    ];
                    
                    const vertexIndex = Math.floor(u * 5) % 5;
                    const vertex = vertices[vertexIndex];
                    const rotAngle = v * Math.PI * 2 * params.d;
                    
                    const x4d = vertex[0] * params.a;
                    const y4d = vertex[1] * params.a;
                    const z4d = vertex[2] * params.a;
                    const w4d = vertex[3] * params.a;
                    
                    const rotated_x = x4d * Math.cos(rotAngle) - w4d * Math.sin(rotAngle);
                    const rotated_w = x4d * Math.sin(rotAngle) + w4d * Math.cos(rotAngle);
                    
                    const projectionFactor = params.f / (params.f - rotated_w);
                    
                    return [
                        rotated_x * projectionFactor,
                        y4d * projectionFactor,
                        z4d * projectionFactor
                    ];
                }
            }
        };
        
        function createShape(shapeKey) {
            if (currentShape) {
                scene.remove(currentShape);
            }
            
            const shape = shapes4D[shapeKey];
            if (!shape) return;
            
            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            const indices = [];
            
            const uSegments = 50;
            const vSegments = 50;
            
            // Generate vertices
            for (let i = 0; i <= uSegments; i++) {
                const u = i / uSegments;
                for (let j = 0; j <= vSegments; j++) {
                    const v = j / vSegments;
                    const [x, y, z] = shape.equation(u, v);
                    vertices.push(x, y, z);
                }
            }
            
            // Generate indices
            for (let i = 0; i < uSegments; i++) {
                for (let j = 0; j < vSegments; j++) {
                    const a = i * (vSegments + 1) + j;
                    const b = a + vSegments + 1;
                    const c = a + 1;
                    const d = b + 1;
                    
                    indices.push(a, b, c);
                    indices.push(b, d, c);
                }
            }
            
            geometry.setIndex(indices);
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.computeVertexNormals();
            
            const hue = document.getElementById('hue-shift').value / 360;
            const glow = parseFloat(document.getElementById('glow-intensity').value);
            
            const material = new THREE.MeshPhongMaterial({
                color: new THREE.Color().setHSL(hue, 1, 0.5),
                emissive: new THREE.Color().setHSL(hue, 1, 0.1 * glow),
                transparent: true,
                opacity: 0.9,
                wireframe: document.querySelector('.mode-btn.active').dataset.mode === 'wireframe'
            });
            
            currentShape = new THREE.Mesh(geometry, material);
            scene.add(currentShape);
            
            // Update info display
            document.getElementById('shape-info').innerHTML = `
                <strong>${shape.name}</strong><br>
                ${shape.description}
            `;
        }
        
        function setupEventListeners() {
            // Shape selection
            document.querySelectorAll('.shape-button[data-shape]').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.shape-button[data-shape]').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    createShape(btn.dataset.shape);
                });
            });
            
            // Visualization mode
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    if (currentShape) {
                        const activeShape = document.querySelector('.shape-button.active');
                        if (activeShape) createShape(activeShape.dataset.shape);
                    }
                });
            });
            
            // Parameter sliders
            ['a', 'd', 'e', 'f', 'w'].forEach(param => {
                const slider = document.getElementById(`param-${param}`);
                const valueDisplay = document.getElementById(`param-${param}-value`);
                
                slider.addEventListener('input', () => {
                    params[param] = parseFloat(slider.value);
                    valueDisplay.textContent = slider.value;
                    
                    const activeShape = document.querySelector('.shape-button.active');
                    if (activeShape) createShape(activeShape.dataset.shape);
                });
            });
            
            // Color controls
            document.getElementById('hue-shift').addEventListener('input', (e) => {
                document.getElementById('hue-value').textContent = e.target.value;
                const activeShape = document.querySelector('.shape-button.active');
                if (activeShape) createShape(activeShape.dataset.shape);
            });
            
            document.getElementById('glow-intensity').addEventListener('input', (e) => {
                document.getElementById('glow-value').textContent = e.target.value;
                const activeShape = document.querySelector('.shape-button.active');
                if (activeShape) createShape(activeShape.dataset.shape);
            });
            
            // Animation controls
            document.getElementById('toggle-animation').addEventListener('click', () => {
                isAnimating = !isAnimating;
                document.getElementById('toggle-animation').textContent = isAnimating ? '⏸️ Stop Auto-Rotation' : '▶️ Start Auto-Rotation';
            });
            
            document.getElementById('anim-speed').addEventListener('input', (e) => {
                animationSpeed = parseFloat(e.target.value);
                document.getElementById('speed-value').textContent = e.target.value;
            });
            
            // Window resize
            window.addEventListener('resize', () => {
                const container = document.getElementById('canvas-container');
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            if (isAnimating && currentShape) {
                currentShape.rotation.x += 0.01 * animationSpeed;
                currentShape.rotation.y += 0.01 * animationSpeed;
                currentShape.rotation.z += 0.005 * animationSpeed;
            }
            
            controls.update();
            renderer.render(scene, camera);
        }
        
        // Initialize on load
        window.addEventListener('load', init);
    </script>
</body>
</html>
