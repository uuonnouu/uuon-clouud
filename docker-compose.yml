version: '3.9'
services:
  clouud:
    build:
      context: .
      cache_from:
        - type=registry,ref=clouud:latest
      cache_to:
        - type=inline
    image: clouud:latest
    container_name: clouud-prod
    ports:
      - "5001:5001"
    environment:
      - AI_BACKEND=ollama
      - OLLAMA_MODEL=clouud:latest
      - OLLAMA_HOST=http://host.docker.internal:11434/v1
      - DATABASE_URL=postgresql://clouud:${DB_PASSWORD:-clouud}@db:5432/clouud?sslmode=disable
      - NODE_ENV=production
      - PORT=5001
      - UUON_BRIDGE_SECRET=${UUON_BRIDGE_SECRET:-localdev}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - clouud-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  db:
    image: postgres:16-alpine
    container_name: clouud-db
    environment:
      POSTGRES_USER: clouud
      POSTGRES_PASSWORD: ${DB_PASSWORD:-clouud}
      POSTGRES_DB: clouud
      POSTGRES_INITDB_ARGS: "-c shared_buffers=256MB -c max_connections=50"
    ports:
      - "5433:5432"
    volumes:
      - clouud_db:/var/lib/postgresql/data
      - ./backups:/backups:ro
    restart: unless-stopped
    networks:
      - clouud-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clouud"]
      interval: 5s
      timeout: 5s
      retries: 5

  trainer:
    build:
      context: .
      dockerfile: Dockerfile.train
      cache_from:
        - type=registry,ref=clouud:train-latest
      cache_to:
        - type=inline
    image: clouud:train-latest
    container_name: clouud-trainer
    volumes:
      - ./CLOUUD_TRAINING_KNOWLEDGE_BASE.md:/app/CLOUUD_TRAINING_KNOWLEDGE_BASE.md:ro
      - ./clouud_training.jsonl:/app/clouud_training.jsonl:rw
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - NODE_ENV=production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - training
    command: python3 train_clouud.py /app/CLOUUD_TRAINING_KNOWLEDGE_BASE.md /app/clouud_training.jsonl
    networks:
      - clouud-network

  redis:
    image: redis:7-alpine
    container_name: clouud-cache
    ports:
      - "6379:6379"
    volumes:
      - clouud_redis:/data
    restart: unless-stopped
    networks:
      - clouud-network
    profiles:
      - cache
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  clouud_db:
    driver: local
  clouud_redis:
    driver: local
  ollama_models:
    driver: local

networks:
  clouud-network:
    driver: bridge
